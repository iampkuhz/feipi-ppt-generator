id: atom-components
title: 原子组件样例
templateId: default
foundation: default
size: wide-16-9
slides:
  - id: atom-textprimitive
    type: AtomSampleSlide
    title: TextPrimitive
    components:
      - type: TextPrimitive
        props:
          text: TextPrimitive 样例
          size: bodyText
          color: copyNavy
  - id: atom-shapeprimitive
    type: AtomSampleSlide
    title: ShapePrimitive
    components:
      - type: ShapePrimitive
        props:
          surface: white
          radius: mdRadius
  - id: atom-iconprimitive
    type: AtomSampleSlide
    title: IconPrimitive
    components:
      - type: IconPrimitive
        props:
          icon: icon.placeholder
          label: IconPrimitive 样例
  - id: atom-iconlabel
    type: AtomSampleSlide
    title: IconLabel
    components:
      - type: IconLabel
        props:
          icon: icon.placeholder
          label: IconLabel 样例
  - id: atom-pagetitle
    type: AtomSampleSlide
    title: PageTitle
    components:
      - type: PageTitle
        props:
          text: PageTitle 样例
          size: pageTitle
          color: copyNavy
  - id: atom-badgepill
    type: AtomSampleSlide
    title: BadgePill
    components:
      - type: BadgePill
        props:
          text: BadgePill 样例
          size: captionLabel
          color: copyNavy
  - id: atom-metricblock
    type: AtomSampleSlide
    title: MetricBlock
    components:
      - type: MetricBlock
        props:
